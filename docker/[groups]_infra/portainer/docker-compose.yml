services:
  agent:
    image: portainer/agent:${IMAGE_TAG}
    environment:
      AGENT_CLUSTER_ADDR: tasks.agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host
    networks:
      - traefik-internetwork
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux

  portainer:
    image: portainer/portainer-ce:${IMAGE_TAG}
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    ports:
        # UI
      - published: 9000
        target: 9000
        protocol: tcp
        mode: host
        # Websocket
      - published: 8000
        target: 8000
        protocol: tcp
        mode: host
    networks:
      - traefik-internetwork
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_BASED_DIR}/portainer:/data
    deploy:
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        delay: 5s
        failure_action: rollback
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.codename == ${SWARM_NODE_CODENAME}

networks:
  traefik-internetwork:
    external: true
