global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

rule_files:
  - './rules.yml'

scrape_configs:
  # Scrape cAdvisor
  - job_name: 'cadvisor'
    dns_sd_configs:
      - names:
          - tasks.cadvisor
        type: A
        port: 8080
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: instance
        replacement: '${1}'

  # Scrape Node Exporter
  - job_name: 'node-exporter'
    dns_sd_configs:
      - names:
          - tasks.node-exporter
        type: A
        port: 9100
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: instance
        replacement: '${1}'

  # Automatically scrape all Docker Swarm services
  # Excludes monitoring infrastructure to prevent duplicates
  - job_name: 'swarm-tasks'
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
    relabel_configs:
      # Exclude monitoring infrastructure services to prevent duplicates
      # These have dedicated scrape jobs with DNS SD
      - source_labels: [__meta_dockerswarm_service_name]
        regex: '.*_(cadvisor|node_exporter|prometheus|grafana|alertmanager)$'
        action: drop
      
      # Add service name as label
      - source_labels: [__meta_dockerswarm_service_name]
        target_label: swarm_service
      
      # Add task name as label
      - source_labels: [__meta_dockerswarm_task_name]
        target_label: task_name
      
      # Add node name as label
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node
      
      # Extract instance name from address
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: instance
        replacement: '${1}'
      
      # Use custom port if prometheus.port label is set (optional)
      - source_labels: [__meta_dockerswarm_service_label_prometheus_port, __meta_dockerswarm_service_name]
        regex: '(.+);(.+)'
        target_label: __address__
        replacement: 'tasks.${2}:${1}'
      
      # Use custom metrics path if prometheus.path label is set (optional)
      - source_labels: [__meta_dockerswarm_service_label_prometheus_path]
        regex: (.+)
        target_label: __metrics_path__
        replacement: '${1}'
