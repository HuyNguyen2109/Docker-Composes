apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # Allow privileged pods (required by prometheus-node-exporter DaemonSet which
    # mounts the host root filesystem and uses elevated capabilities).
    # Without these labels, Kubernetes PodSecurity Admission emits warnings during
    # helm upgrade for every node-exporter pod template.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
