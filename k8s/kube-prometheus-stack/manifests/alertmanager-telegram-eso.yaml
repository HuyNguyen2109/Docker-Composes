apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram-eso
  namespace: monitoring
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-telegram-secret
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: bot_token
      remoteRef:
        key: docker-secrets
        property: common-telegram-bot-token
