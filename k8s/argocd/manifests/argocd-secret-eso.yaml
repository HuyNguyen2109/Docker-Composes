apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-secret-eso
  namespace: administrator-apps
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: argocd-secret-eso
    creationPolicy: Owner
  data:
    - secretKey: redis-password
      remoteRef:
        key: docker-secrets
        property: dragonflydb-credentials
    - secretKey: dex.authentik.clientSecret
      remoteRef:
        key: docker-secrets
        property: argocd-oidc-client-secret

