### Official Link: https://artifacthub.io/packages/helm/argo/argo-cd

namespaceOverride: argocd-system

crds:
  install: true
  keep: true

global:
  domain: argocd.mcb-svc.work
  networkPolicy:
    create: true
  nodeSelector:
    node.kubernetes.io/worker: "true"
    topology.kubernetes.io/region: "sg-prod-01"
  # Pod-level security context applied to all components
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault

redis:
  enabled: false
externalRedis:
  enabled: true
  host: "vn2.mcb-svc.work"
  port: 6379
  existingSecret: redis-auth-secret-eso

server:
  containerSecurityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
  ingress:
    enabled: true
    controller: generic
    ingressClassName: traefik
    tls: true
    annotations:
      cert-manager.io/cluster-issuer: "cloudflare-clusterissuer"
      traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
      traefik.ingress.kubernetes.io/router.tls: "true"

controller:
  containerSecurityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

dex:
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

repoServer:
  containerSecurityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

applicationSet:
  containerSecurityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

configs:
  cm:
    exec.enabled: true
    statusbadge.enabled: true
    dex.config: |
      connectors:
      - config:
          issuer: "https://auth.mcb-svc.work/application/o/argocd/"
          clientID: "9vf7DhzucXF7ioTItcvFqlNwBGraajx67pPSG6QY"
          clientSecret: "$dex.authentik.clientSecret"
          insecureEnableGroups: true
          scopes:
          - openid
          - profile
          - email
        name: authentik
        type: oidc
        id: authentik
  params:
    server.insecure: true
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, homelab, role:admin
    scopes: '[groups]'

