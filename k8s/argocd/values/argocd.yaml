### Official Link: https://artifacthub.io/packages/helm/argo/argo-cd
### Installation using Helm: helm upgrade --install my-argo-cd oci://ghcr.io/argoproj/argo-helm/argo-cd 
namespaceOverride: administrator-apps

crds:
  install: true
  keep: true

global:
  domain: argocd.internal
  networkPolicy:
    create: true
  nodeSelector: {}
  # Pod-level security context applied to all components
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault

redis:
  enabled: false
externalRedis:
  enabled: true
  host: "dragonfly.administrator-apps.svc.cluster.local"
  port: 6379
  existingSecret: argo-redis-auth-eso

server:
  containerSecurityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
  ingress:
    enabled: true
    controller: generic
    ingressClassName: traefik
    tls: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: true
      cert-manager.io/cluster-issuer: selfsigned-clusterissuer

controller:
  containerSecurityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

dex:
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

repoServer:
  containerSecurityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

applicationSet:
  containerSecurityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

configs:
  cm:
    exec.enabled: true
    statusbadge.enabled: true
    dex.config: |
      connectors:
      - config:
          issuer: "https://idp.mcb-homelab.com/application/o/argo-cd/"
          clientID: "yGtApPgW9pUWxQdOW39MrSngyPNweb6KfcqEv713"
          clientSecret: "$dex.authentik.clientSecret"
          insecureEnableGroups: true
          scopes:
          - openid
          - profile
          - email
        name: authentik
        type: oidc
        id: authentik
  params:
    server.insecure: true
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, homelab, role:admin
    scopes: '[groups]'

