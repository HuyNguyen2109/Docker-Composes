### Official Link: https://artifacthub.io/packages/helm/argo/argo-cd
### Installation using Helm: helm upgrade --install my-argo-cd oci://ghcr.io/argoproj/argo-helm/argo-cd 
namespaceOverride: administrator-apps

crds:
  install: true
  keep: true

global:
  domain: argocd.ingress.internal
  networkPolicy:
    create: true
  nodeSelector: {}
  # Pod-level security context applied to all components
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault

redis:
  enabled: false
externalRedis:
  enabled: true
  host: "unraid.internal"
  port: 6379
  existingSecret: argocd-secret-eso

server:
  containerSecurityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
  ingress:
    enabled: true
    controller: generic
    ingressClassName: traefik
    tls: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: true
      cert-manager.io/cluster-issuer: selfsigned-clusterissuer

controller:
  containerSecurityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

dex:
  livelinessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

repoServer:
  initContainers:
    - name: download-avp
      image: alpine:3.21
      command: [sh, -c]
      args:
        - |
          wget -O /custom-tools/argocd-vault-plugin \
            https://github.com/argoproj-labs/argocd-vault-plugin/releases/download/v1.18.1/argocd-vault-plugin_1.18.1_linux_amd64 && \
          chmod +x /custom-tools/argocd-vault-plugin
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
  extraContainers:
    - name: avp-helm
      command: [/var/run/argocd/argocd-cmp-server]
      image: quay.io/argoproj/argocd:v3.3.9
      envFrom:
        - secretRef:
            name: argocd-vault-plugin-credentials
      env:
        - name: HELM_CACHE_HOME
          value: /tmp/helm/cache
        - name: HELM_CONFIG_HOME
          value: /tmp/helm/config
        - name: HELM_DATA_HOME
          value: /tmp/helm/data
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      volumeMounts:
        - mountPath: /var/run/argocd
          name: var-files
        - mountPath: /home/argocd/cmp-server/plugins
          name: plugins
        - mountPath: /tmp
          name: tmp
        - mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: avp-helm.yaml
          name: cmp-plugin
        - mountPath: /usr/local/bin/argocd-vault-plugin
          name: custom-tools
          subPath: argocd-vault-plugin
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: cmp-plugin
      configMap:
        name: argocd-cmp-cm
  containerSecurityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

applicationSet:
  containerSecurityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

configs:
  cmp:
    create: true
    plugins:
      avp-helm:
        allowConcurrency: true
        generate:
          command:
            - bash
            - -c
            - |
              helm repo add "${ARGOCD_ENV_HELM_REPO_NAME}" "${ARGOCD_ENV_HELM_REPO_URL}" --force-update > /dev/null 2>&1
              cat > /tmp/avp-resolver.yaml << 'AVPEOF'
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: avp-resolver
              data:
                dragonflydb-credentials: <path:kubernetes/data/docker-secrets#dragonflydb-credentials>
              AVPEOF
              DRAGONFLYDB_PASS=$(argocd-vault-plugin generate /tmp/avp-resolver.yaml | grep 'dragonflydb-credentials:' | awk '{print $2}')
              if [ -z "${DRAGONFLYDB_PASS}" ]; then echo "ERROR: failed to resolve dragonflydb-credentials from Vault" >&2; exit 1; fi
              helm template "${ARGOCD_APP_NAME}" "${ARGOCD_ENV_HELM_REPO_NAME}/${ARGOCD_ENV_HELM_CHART_NAME}" \
                --version "${ARGOCD_ENV_HELM_CHART_VERSION}" \
                --include-crds \
                -n "${ARGOCD_APP_NAMESPACE}" \
                -f "${ARGOCD_ENV_HELM_VALUES_FILE}" \
                --set "redis.external.password=${DRAGONFLYDB_PASS}"
        lockRepo: false
  cm:
    exec.enabled: true
    statusbadge.enabled: true
    dex.config: |
      connectors:
      - config:
          issuer: "https://idp.mcb-homelab.com/application/o/argo-cd/"
          clientID: "yGtApPgW9pUWxQdOW39MrSngyPNweb6KfcqEv713"
          clientSecret: "$dex.authentik.clientSecret"
          insecureEnableGroups: true
          scopes:
          - openid
          - profile
          - email
        name: authentik
        type: oidc
        id: authentik
  params:
    server.insecure: true
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, homelab, role:admin
    scopes: '[groups]'

