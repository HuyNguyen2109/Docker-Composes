---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanup-sa
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-resource-cleanup
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["namespaces/finalize"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["longhorn.io"]
    resources: ["orphans"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-resource-cleanup-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-resource-cleanup
subjects:
  - kind: ServiceAccount
    name: cleanup-sa
    namespace: kube-system
---
# CronJob 1: Hourly — delete Failed, Evicted, OOMKilled and orphaned Succeeded pods
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup-failed-pods
  namespace: kube-system
spec:
  schedule: "0 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: cleanup-sa
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: docker-reg-creds
          containers:
            - name: kubectl
              image: bitnami/kubectl:latest
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -c
                - |
                  set -uo pipefail
                  echo "=== Pod Cleanup: $(date -u) ==="

                  echo "--- Failed pods ---"
                  kubectl get pods --all-namespaces \
                    --field-selector=status.phase=Failed \
                    -o custom-columns="NS:.metadata.namespace,NAME:.metadata.name" \
                    --no-headers 2>/dev/null | \
                    while read -r ns name; do
                      echo "  [del] Failed: $name ($ns)"
                      kubectl delete pod "$name" -n "$ns" --ignore-not-found
                    done

                  echo "--- Evicted / Error / OOMKilled pods ---"
                  kubectl get pods --all-namespaces --no-headers 2>/dev/null | \
                    awk '$4=="Evicted" || $4=="Error" || $4=="OOMKilled" {print $1,$2}' | \
                    while read -r ns name; do
                      echo "  [del] Terminal: $name ($ns)"
                      kubectl delete pod "$name" -n "$ns" --ignore-not-found
                    done

                  echo "--- Succeeded standalone pods (not owned by a Job) ---"
                  kubectl get pods --all-namespaces \
                    --field-selector=status.phase=Succeeded \
                    -o custom-columns="NS:.metadata.namespace,NAME:.metadata.name,OWNER:.metadata.ownerReferences[0].kind" \
                    --no-headers 2>/dev/null | \
                    awk '$3 != "Job" {print $1,$2}' | \
                    while read -r ns name; do
                      echo "  [del] Succeeded standalone: $name ($ns)"
                      kubectl delete pod "$name" -n "$ns" --ignore-not-found
                    done

                  echo "=== Pod Cleanup Done ==="
---
# CronJob 2: Daily 02:00 UTC — clean up orphaned cluster resources
#
# Handles:
#   - Longhorn orphaned replicas (causes DiskPressure if accumulated)
#   - Released PersistentVolumes
#   - Orphaned PVCs: Bound, no pod mounts them, not owned by a StatefulSet
#     (add label cleanup.skip=true to any PVC to exempt it from deletion)
#   - Stuck Terminating namespaces (removes stale finalizers)
#   - Old completed/failed Jobs with no CronJob owner (older than 3 days)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup-orphaned-resources
  namespace: kube-system
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: cleanup-sa
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: docker-reg-creds
          containers:
            - name: kubectl
              image: bitnami/kubectl:latest
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -c
                - |
                  set -uo pipefail
                  echo "=== Orphaned Resource Cleanup: $(date -u) ==="

                  # ----------------------------------------------------------------
                  # 1. Longhorn orphaned replicas
                  #    These accumulate when volumes are deleted but replica data
                  #    is left behind, consuming block storage and triggering
                  #    DiskPressure on nodes.
                  # ----------------------------------------------------------------
                  echo ""
                  echo "--- Longhorn Orphaned Replicas ---"
                  if kubectl api-resources --api-group=longhorn.io 2>/dev/null | grep -q orphan; then
                    LONGHORN_NS=$(kubectl get pods --all-namespaces --no-headers \
                      -l app=longhorn-manager \
                      -o custom-columns="NS:.metadata.namespace" 2>/dev/null | head -1)
                    if [ -z "$LONGHORN_NS" ]; then
                      LONGHORN_NS=$(kubectl get orphans.longhorn.io --all-namespaces \
                        --no-headers -o custom-columns="NS:.metadata.namespace" \
                        2>/dev/null | head -1)
                    fi
                    LONGHORN_NS=${LONGHORN_NS:-longhorn-system}
                    echo "  Namespace: $LONGHORN_NS"
                    kubectl get orphans.longhorn.io -n "$LONGHORN_NS" \
                      --no-headers -o custom-columns="NAME:.metadata.name" 2>/dev/null | \
                      while read -r name; do
                        [ -z "$name" ] && continue
                        echo "  [del] $name"
                        kubectl delete orphan.longhorn.io "$name" -n "$LONGHORN_NS" \
                          --ignore-not-found
                      done
                  else
                    echo "  Longhorn CRD not present, skipping"
                  fi

                  # ----------------------------------------------------------------
                  # 2. Released PersistentVolumes
                  #    A PV in Released state has no bound PVC and its data is no
                  #    longer accessible. Safe to remove so storage can be reclaimed.
                  # ----------------------------------------------------------------
                  echo ""
                  echo "--- Released PersistentVolumes ---"
                  kubectl get pv --no-headers \
                    -o custom-columns="NAME:.metadata.name,PHASE:.status.phase" \
                    2>/dev/null | \
                    awk '$2=="Released" {print $1}' | \
                    while read -r pv; do
                      echo "  [del] Released PV: $pv"
                      kubectl delete pv "$pv" --ignore-not-found
                    done

                  # ----------------------------------------------------------------
                  # 3. Orphaned PVCs
                  #    A PVC is considered orphaned when ALL of these are true:
                  #      - It is Bound
                  #      - No pod in its namespace currently mounts it
                  #      - No StatefulSet in its namespace owns it via a
                  #        volumeClaimTemplate (pattern: <tmpl>-<sts>-<ordinal>)
                  #    System namespaces and PVCs labeled cleanup.skip=true are
                  #    skipped. This handles leftover PVCs when apps move namespaces.
                  # ----------------------------------------------------------------
                  echo ""
                  echo "--- Orphaned PVCs ---"
                  kubectl get pvc --all-namespaces --no-headers \
                    -o custom-columns="NS:.metadata.namespace,NAME:.metadata.name,PHASE:.status.phase" \
                    2>/dev/null | \
                    while read -r ns pvcname phase; do
                      [ "$phase" != "Bound" ] && continue
                      case "$ns" in
                        kube-system|kube-public|kube-node-lease) continue ;;
                      esac

                      skip=$(kubectl get pvc "$pvcname" -n "$ns" \
                        -o jsonpath='{.metadata.labels.cleanup\.skip}' 2>/dev/null)
                      [ "$skip" = "true" ] && continue

                      # Collect all PVCs mounted by pods in this namespace
                      pod_pvcs=$(kubectl get pods -n "$ns" \
                        -o jsonpath='{range .items[*]}{range .spec.volumes[*]}{.persistentVolumeClaim.claimName}{"\n"}{end}{end}' \
                        2>/dev/null || true)
                      echo "$pod_pvcs" | grep -q "^${pvcname}$" && continue

                      # Check if a StatefulSet owns this PVC via volumeClaimTemplate
                      # Naming pattern: <template-name>-<statefulset-name>-<ordinal>
                      owned=0
                      while read -r sts_name; do
                        [ -z "$sts_name" ] && continue
                        while read -r tmpl; do
                          [ -z "$tmpl" ] && continue
                          if echo "$pvcname" | grep -qE "^${tmpl}-${sts_name}-[0-9]+$"; then
                            owned=1
                            break
                          fi
                        done < <(kubectl get statefulset "$sts_name" -n "$ns" \
                          -o jsonpath='{range .spec.volumeClaimTemplates[*]}{.metadata.name}{"\n"}{end}' \
                          2>/dev/null)
                        [ "$owned" -eq 1 ] && break
                      done < <(kubectl get statefulset -n "$ns" --no-headers \
                        -o custom-columns="NAME:.metadata.name" 2>/dev/null)
                      [ "$owned" -eq 1 ] && continue

                      echo "  [del] Orphaned PVC: $pvcname ($ns)"
                      kubectl delete pvc "$pvcname" -n "$ns" --ignore-not-found
                    done

                  # ----------------------------------------------------------------
                  # 4. Stuck Terminating namespaces
                  #    Removes stale spec.finalizers so the namespace lifecycle
                  #    controller can complete the deletion.
                  # ----------------------------------------------------------------
                  echo ""
                  echo "--- Stuck Terminating Namespaces ---"
                  kubectl get namespaces --no-headers \
                    -o custom-columns="NAME:.metadata.name,STATUS:.status.phase" \
                    2>/dev/null | \
                    awk '$2=="Terminating" {print $1}' | \
                    while read -r ns; do
                      echo "  [finalize] $ns"
                      kubectl get namespace "$ns" -o json 2>/dev/null | \
                        sed 's/"finalizers":[[:space:]]*\[[^]]*]/"finalizers": []/g' | \
                        kubectl replace --raw "/api/v1/namespaces/${ns}/finalize" -f - \
                        2>/dev/null || echo "  Warning: could not finalize $ns"
                    done

                  # ----------------------------------------------------------------
                  # 5. Old orphaned completed/failed Jobs (>3 days, no CronJob owner)
                  #    Jobs managed by a CronJob are left to the CronJob's own
                  #    history limits. Only standalone Jobs are cleaned here.
                  # ----------------------------------------------------------------
                  echo ""
                  echo "--- Old Orphaned Completed/Failed Jobs ---"
                  kubectl get jobs --all-namespaces --no-headers \
                    -o custom-columns="NS:.metadata.namespace,NAME:.metadata.name,DONE:.status.completionTime,OWNER:.metadata.ownerReferences[0].kind" \
                    2>/dev/null | \
                    while read -r ns name done_time owner_kind; do
                      [ "$owner_kind" = "CronJob" ] && continue
                      if [ -z "$done_time" ] || [ "$done_time" = "<none>" ]; then
                        continue
                      fi
                      comp_epoch=$(date -d "$done_time" +%s 2>/dev/null || echo 0)
                      [ "$comp_epoch" -eq 0 ] && continue
                      age=$(( ($(date +%s) - comp_epoch) / 86400 ))
                      [ "$age" -lt 3 ] && continue
                      echo "  [del] Old Job: $name ($ns, age=${age}d)"
                      kubectl delete job "$name" -n "$ns" --ignore-not-found
                    done

                  echo ""
                  echo "=== Orphaned Resource Cleanup Done ==="
