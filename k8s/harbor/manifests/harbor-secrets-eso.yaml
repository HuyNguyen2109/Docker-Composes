apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-secrets-eso
  namespace: administrator-apps
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-secrets-eso
    creationPolicy: Owner
  data:
    - secretKey: HARBOR_ADMIN_PASSWORD
      remoteRef:
        key: docker-secrets
        property: harbor-admin-password
    - secretKey: secretKey
      remoteRef:
        key: docker-secrets
        property: harbor-secret-key
    - secretKey: REGISTRY_STORAGE_S3_ACCESSKEY
      remoteRef:
        key: docker-secrets
        property: harbor-s3-access-key
    - secretKey: REGISTRY_STORAGE_S3_SECRETKEY
      remoteRef:
        key: docker-secrets
        property: harbor-s3-secret-key
    - secretKey: password
      remoteRef:
        key: docker-secrets
        property: harbor-db-password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: docker-secrets
        property: dragonflydb-credentials