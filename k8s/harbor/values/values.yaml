### Official Link: https://artifacthub.io/packages/helm/harbor/harbor

expose:
  type: ingress
  ingress:
    hosts:
      core: registry.ingress.internal
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: selfsigned-clusterissuer
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: true
  tls:
    enabled: true
    certSource: auto
    auto:
      commonName: cert-manager

externalURL: https://registry.ingress.internal
persistence:
  enabled: true
  resourcePolicy: "keep"
  persistentVolumeClaim:
    registry:
      storageClass: synology-iscsi-storage
      size: 10Gi
    jobservice:
      storageClass: synology-iscsi-storage
      size: 1Gi
    trivy:
      storageClass: synology-iscsi-storage
      size: 10Gi
  imageChartStorage:
    type: s3
    s3:
      existingSecret: harbor-secrets-eso
      bucket: harbor
      region: auto
      regionendpoint: https://s3.mcb-homelab.com


existingSecretSecretKey: harbor-secrets-eso
existingSecretAdminPassword: harbor-secrets-eso

cache:
  enabled: true

# Global container security context applied to ALL Harbor component containers.
# Harbor chart templates reference .Values.containerSecurityContext globally — not per-component.
# Pod-level security contexts (runAsUser: 10000, fsGroup: 10000) are hardcoded in chart templates.
# readOnlyRootFilesystem is intentionally omitted: Harbor components write to temp dirs at runtime.
containerSecurityContext:
  privileged: false
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

portal:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
  nodeSelector: {}

core:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
  nodeSelector: {}

jobservice:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
  nodeSelector:
    node-role.kubernetes.io/storage: "true"

registry:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
  nodeSelector: {}

trivy:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  nodeSelector:
    node-role.kubernetes.io/storage: "true"

database:
  type: external
  external:
    host: pgbouncer.databases.svc.cluster.local
    port: 5432
    username: harbor-db-admin
    coreDatabase: harbor
    existingSecret: harbor-secrets-eso

redis:
  type: external
  external:
    addr: unraid.internal:6379
    username: default
    password: <path:kubernetes/data/docker-secrets#dragonflydb-credentials>
