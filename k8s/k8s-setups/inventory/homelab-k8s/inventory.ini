# Homelab K8s cluster — 1 CP + 3 worker topology.
# talos-alpha = control-plane only; talos-00/01/02 = worker only.
# etcd for K8s runs on talos-alpha (host systemd service).
# etcd for Patroni continues on talos-00/01/02 (not managed by Kubespray).
# SSH: user=ubuntu, key=~/ssh-keys/homelab-linux (set in group_vars/all/all.yml)
#
# K8s version: v1.34.4 | OS: Ubuntu 24.04.4 LTS | Runtime: containerd v2.2.1
# etcd: v3.5.27 | CNI: Calico v3.30.6 VXLAN

[kube_control_plane]
talos-alpha ansible_host=192.168.1.10 ip=192.168.1.10 etcd_member_name=etcd0

[kube_node]
talos-00 ansible_host=192.168.1.11  ip=192.168.1.11  etcd_member_name=etcd1
talos-01 ansible_host=192.168.1.12  ip=192.168.1.12  etcd_member_name=etcd2
talos-02 ansible_host=192.168.1.13  ip=192.168.1.13  etcd_member_name=etcd3

[etcd:children]
kube_control_plane

[k8s_cluster:children]
kube_control_plane
kube_node

[calico_rr]

[vault]
