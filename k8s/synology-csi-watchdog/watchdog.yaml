apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-watchdog
  namespace: synology-csi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: csi-watchdog
  namespace: synology-csi
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: csi-watchdog
  namespace: synology-csi
subjects:
  - kind: ServiceAccount
    name: csi-watchdog
    namespace: synology-csi
roleRef:
  kind: Role
  name: csi-watchdog
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: csi-node-watchdog
  namespace: synology-csi
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: csi-watchdog
          restartPolicy: OnFailure
          containers:
            - name: watchdog
              image: bitnami/kubectl:latest
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -u
                  NS="synology-csi"
                  for pod in $(kubectl get pods -n "$NS" -l app=synology-csi-node -o name 2>/dev/null); do
                    name="${pod#pod/}"
                    if kubectl logs -n "$NS" "$name" -c csi-plugin 2>/dev/null | head -50 | grep -q "Failed to add DSM"; then
                      echo "Restarting broken CSI node plugin: $name"
                      kubectl delete pod -n "$NS" "$name"
                    else
                      echo "Healthy: $name"
                    fi
                  done
