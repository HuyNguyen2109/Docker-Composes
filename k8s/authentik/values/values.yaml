global:
  image:
    repository: docker.io/authentik/server
    tag: "2026.2.1"
  nodeSelector:
    node.kubernetes.io/control-plane:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-secret-key-eso
          key: authentik-secret-key
    # Main Postgres Configuration
    - name: AUTHENTIK_POSTGRESQL__HOST
      value: "lb.netbird.local"
    - name: AUTHENTIK_POSTGRESQL__PORT
      value: "6432"
    - name: AUTHENTIK_POSTGRESQL__USER
      value: "authentik-db-admin"
    - name: AUTHENTIK_POSTGRESQL__NAME
      value: "authentik"
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: postgres-db-password-eso
          key: authentik-db-password
    # Read-replica Postgres Configuration
    - name: AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__HOST
      value: "lb.netbird.local"
    - name: AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__PORT
      value: "6433"
    - name: AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__USER
      value: "authentik-db-admin"
    - name: AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__NAME
      value: "authentik"
    - name: AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__PASSWORD
      valueFrom:
        secretKeyRef:
          name: postgres-db-password-eso
          key: authentik-db-password
    - name: AUTHENTIK_STORAGE__MEDIA__BACKEND
      value: "s3"
    - name: AUTHENTIK_STORAGE__MEDIA__S3__REGION
      value: "auto"
    - name: AUTHENTIK_STORAGE__MEDIA__S3__ENDPOINT
      value: "http://unraid.netbird.local:9000"
    - name: AUTHENTIK_STORAGE__MEDIA__S3__BUCKET_NAME
      value: "authentik"
    - name: AUTHENTIK_STORAGE__MEDIA__S3__USE_SSL
      value: "true"
    - name: AUTHENTIK_STORAGE__MEDIA__S3__ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: s3-client-credentials-eso
          key: s3-client-id
    - name: AUTHENTIK_STORAGE__MEDIA__S3__SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: s3-client-credentials-eso
          key: s3-client-secret

authentik:
  log_level: error
  error_reporting:
    enabled: true
  postgresql: {}
  redis: {}

server:
  service:
    type: NodePort
  replicas: 1
  livelinessProbe:
    timeoutSeconds: 30
  readinessProbe:
    timeoutSeconds: 30
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  # ingress:
  #   enabled: true
  #   ingressClassName: traefik
  #   annotations:
  #     cert-manager.io/cluster-issuer: "cloudflare-clusterissuer"
  #     traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
  #     traefik.ingress.kubernetes.io/router.tls: "true"
  #   hosts:
  #     - auth.mcb-svc.work
  #   tls:
  #     - secretName: cloudflare-wildcard-cert-tls
  #       hosts:
  #         - auth.mcb-svc.work
  # add a tmpfs volume that will replace /dev/shm
  volumes:
    - name: devshm
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi   # adjust if needed

  # mount that volume at /dev/shm in the main container
  volumeMounts:
    - name: devshm
      mountPath: /dev/shm
  initContainers:
    - name: fix-shm
      image: busybox
      command: ["sh", "-c", "chmod 1777 /dev/shm"]
      securityContext:
        runAsUser: 0
      volumeMounts:
        - name: devshm
          mountPath: /dev/shm

  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/arch
              operator: In
              values:
                - amd64

worker:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault


