### Official Link: https://artifacthub.io/packages/helm/influxdata/influxdb2

adminUser:
  organization: "default"
  bucket: "default"
  user: "admin"
  password: ""

persistence:
  enabled: true
  useExisting: true
  name: "influxdb-influxdb2-smaller"
  storageClass: longhorn
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /var/lib/influxdb2

service:
  type: LoadBalancer
  port: 8086
  targetPort: 8086

ingress:
  enabled: true
  tls: true
  className: traefik
  hostname: influxdb.mcb-svc.work

# Pod-level security context (chart key: securityContext).
# readOnlyRootFilesystem is NOT set here because InfluxDB2 must write to
# /var/lib/influxdb2; use a PVC for that path instead.
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
